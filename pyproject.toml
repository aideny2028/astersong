[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astersong"
version = "0.1.0"
description = "Deterministic sonification of real astronomical data; first mapping: brightness-decline-to-pitch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Aiden Yeoh" }]
keywords = ["sonification", "astronomy", "history-of-science", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/astersong"]

[tool.pytest.ini_options]
testpaths = ["tests"]
